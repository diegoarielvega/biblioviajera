<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Viajera — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper: #EFE7D2;
    --paper-dark: #E3D8BC;
    --paper-darker: #D8CAA6;
    --ink: #2A2420;
    --ink-soft: #5C5346;
    --ink-faint: #8A806F;
    --brass: #96702E;
    --brass-light: #B08B44;
    --stamp: #9B3B30;
    --teal: #2F5C56;
    --shadow: rgba(42,36,32,0.18);
    --radius: 3px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(ellipse at top left, rgba(150,112,46,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(47,92,86,0.05), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
  }

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.35;
    background-image:
      repeating-linear-gradient(0deg, rgba(42,36,32,0.015) 0px, rgba(42,36,32,0.015) 1px, transparent 1px, transparent 3px);
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    border-bottom:2px solid var(--ink);
    padding-bottom:1.1rem;
    margin-bottom:0.4rem;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
  }

  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.16em;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:0.15rem 0.4rem;
    border-radius:2px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2rem, 4.5vw, 3.1rem);
    margin:0;
    letter-spacing:-0.01em;
    line-height:1;
  }

  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  #count{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
    white-space:nowrap;
    padding-bottom:0.2rem;
  }

  /* ---------- Search ---------- */
  .search-row{
    margin:1.8rem 0 2.2rem;
    position:relative;
  }

  .search-row svg{
    position:absolute;
    left:0.9rem;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:var(--ink-soft);
    pointer-events:none;
  }

  #search{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size:1.05rem;
    font-style:italic;
    padding:0.85rem 1rem 0.85rem 2.7rem;
    background:var(--paper-dark);
    border:1px solid var(--paper-darker);
    border-bottom:2px solid var(--ink);
    border-radius:var(--radius);
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #search::placeholder{color:var(--ink-faint);}

  #search:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(150,112,46,0.18);
  }

  /* ---------- Carousel ---------- */
  .carousel-shell{
    position:relative;
  }

  .carousel{
    display:flex;
    gap:1.6rem;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    padding:0.6rem 0.2rem 1.4rem;
    scrollbar-width:thin;
    scrollbar-color:var(--brass-light) transparent;
  }

  .carousel::-webkit-scrollbar{height:6px;}
  .carousel::-webkit-scrollbar-thumb{background:var(--brass-light); border-radius:4px;}

  .book-card{
    scroll-snap-align:start;
    flex:0 0 auto;
    width:150px;
    cursor:pointer;
    text-align:left;
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    color:inherit;
    position:relative;
  }

  .cover-frame{
    position:relative;
    width:150px;
    height:225px;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--paper-darker);
    box-shadow:0 5px 14px var(--shadow);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }

  .book-card:hover .cover-frame,
  .book-card:focus-visible .cover-frame{
    transform:translateY(-5px) rotate(-0.6deg);
    box-shadow:0 12px 22px var(--shadow);
  }

  .cover-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .cover-frame .no-cover{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0.8rem;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.85rem;
    color:var(--ink-soft);
    background:
      repeating-linear-gradient(135deg, var(--paper-darker), var(--paper-darker) 8px, var(--paper-dark) 8px, var(--paper-dark) 16px);
  }

  .tag{
    position:absolute;
    top:-8px;
    right:8px;
    background:var(--stamp);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    letter-spacing:0.03em;
    padding:0.18rem 0.4rem;
    border-radius:2px;
    transform:rotate(4deg);
    box-shadow:0 2px 5px var(--shadow);
    max-width:80px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .book-meta{
    margin-top:0.65rem;
    line-height:1.25;
  }

  .book-meta .t{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.92rem;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .book-meta .a{
    font-size:0.8rem;
    font-style:italic;
    color:var(--ink-soft);
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .nav-btn{
    position:absolute;
    top:38%;
    transform:translateY(-50%);
    width:2.4rem;
    height:2.4rem;
    border-radius:50%;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    box-shadow:0 3px 8px var(--shadow);
  }
  .nav-btn:hover{background:var(--ink); color:var(--paper);}
  .nav-prev{left:-1.2rem;}
  .nav-next{right:-1.2rem;}

  @media (max-width: 640px){
    .nav-btn{display:none;}
  }

  /* ---------- Empty / loading / error states ---------- */
  .state-box{
    text-align:center;
    padding:3.5rem 1rem;
    color:var(--ink-soft);
  }
  .state-box .glyph{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.5rem;
    color:var(--ink);
    display:block;
    margin-bottom:0.4rem;
  }
  .state-box code{
    display:block;
    margin-top:0.9rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    background:var(--paper-dark);
    padding:0.8rem 1rem;
    border-radius:var(--radius);
    max-width:560px;
    margin-inline:auto;
    text-align:left;
    line-height:1.6;
    white-space:pre-wrap;
  }

  /* ---------- Detail overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,17,14,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  .index-card{
    position:relative;
    background:var(--paper-dark);
    border:1px solid var(--paper-darker);
    border-radius:6px;
    max-width:680px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:2.2rem 2rem 2rem;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    transform:translateY(14px) scale(0.98);
    transition:transform 0.22s ease;
  }
  .overlay.open .index-card{transform:translateY(0) scale(1);}

  .punch-holes{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:2.2rem;
  }
  .punch-holes span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--paper);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.25);
  }

  .close-btn{
    position:absolute;
    top:1rem;
    right:1rem;
    width:2.1rem;
    height:2.1rem;
    border-radius:50%;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-size:1.1rem;
    cursor:pointer;
    line-height:1;
  }
  .close-btn:hover{background:var(--ink); color:var(--paper);}

  .card-body{
    display:flex;
    gap:1.6rem;
    margin-top:1.6rem;
    flex-wrap:wrap;
  }

  .card-cover{
    flex:0 0 auto;
    width:140px;
    height:210px;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 8px 20px var(--shadow);
    background:var(--paper-darker);
  }
  .card-cover img{width:100%;height:100%;object-fit:cover;display:block;}

  .card-info{flex:1 1 260px; min-width:0;}

  .card-info h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 0.15rem;
    line-height:1.1;
  }

  .card-info .author{
    font-style:italic;
    color:var(--ink-soft);
    font-size:1rem;
    margin-bottom:0.9rem;
  }

  .fields{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:0.4rem 0.7rem;
    color:var(--ink-soft);
  }
  .fields dt{text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);}
  .fields dd{margin:0; color:var(--ink); border-bottom:1px dashed var(--paper-darker); padding-bottom:0.3rem;}

  .location-tag{
    display:inline-block;
    margin-top:1rem;
    background:var(--teal);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    padding:0.3rem 0.6rem;
    border-radius:2px;
  }

  .synopsis{
    margin-top:1.4rem;
    padding-top:1.1rem;
    border-top:1px dashed var(--paper-darker);
    font-size:0.98rem;
    line-height:1.6;
    color:var(--ink);
  }
  .synopsis .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    display:block;
    margin-bottom:0.4rem;
  }

  footer{
    text-align:center;
    margin-top:3rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-faint);
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <div class="brand">
        <span class="brand-mark">EX LIBRIS</span>
        <h1>Biblioteca Viajera</h1>
      </div>
      <div class="tagline">catálogo de a bordo</div>
    </div>
    <div id="count"></div>
  </header>

  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <label for="search" class="visually-hidden">Buscar por título o autor</label>
    <input id="search" type="text" placeholder="Buscar por título o autor…" autocomplete="off">
  </div>

  <div class="carousel-shell">
    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Desplazar hacia atrás">‹</button>
    <div class="carousel" id="carousel" role="list"></div>
    <button class="nav-btn nav-next" id="nextBtn" aria-label="Desplazar hacia adelante">›</button>
  </div>

  <div id="stateBox"></div>

  <footer>biblioteca viajera · catálogo generado automáticamente desde el archivo</footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="index-card" id="indexCard">
    <div class="punch-holes"><span></span><span></span></div>
    <button class="close-btn" id="closeBtn" aria-label="Cerrar ficha">×</button>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN
   Pegá acá la URL de tu Google Sheet publicado como CSV:
   Archivo > Compartir > Publicar en la web > selecciona la
   hoja > formato CSV > Publicar. Copiá esa URL acá abajo.
   ========================================================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHuwSgfsqvtnOud-1NRgQ7Qg-ngpYvlYHbD6L0WZmsGyfqE6lIkYAlHDAooR9NA9dSwQI1w_G3TWrU/pub?gid=0&single=true&output=csv";

/* ========================================================= */

const el = {
  carousel: document.getElementById('carousel'),
  search: document.getElementById('search'),
  count: document.getElementById('count'),
  stateBox: document.getElementById('stateBox'),
  overlay: document.getElementById('overlay'),
  indexCard: document.getElementById('indexCard'),
  cardBody: document.getElementById('cardBody'),
  closeBtn: document.getElementById('closeBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
};

let LIBROS = [];
let VISIBLES = [];

function normalizar(str){
  return (str || '')
    .toString()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function campo(row, nombre){
  // Busca la columna sin importar mayúsculas/acentos exactos
  const claves = Object.keys(row);
  const objetivo = normalizar(nombre);
  const encontrada = claves.find(k => normalizar(k) === objetivo);
  return encontrada ? (row[encontrada] || '').toString().trim() : '';
}

function renderState(html){
  el.stateBox.innerHTML = html;
}

function clearState(){
  el.stateBox.innerHTML = '';
}

async function cargarDatos(){
  if(!CSV_URL || CSV_URL.indexOf('PEGA_AQUI') !== -1){
    renderState(`
      <div class="state-box">
        <span class="glyph">Todavía no configuraste la fuente de datos</span>
        Abrí este archivo con un editor de texto y reemplazá <strong>CSV_URL</strong>
        por la URL de tu Google Sheet publicado como CSV.
        <code>Archivo → Compartir → Publicar en la web → elegí la hoja → formato CSV → Publicar</code>
      </div>`);
    return;
  }

  renderState(`<div class="state-box"><span class="glyph">Buscando en el archivo…</span>cargando el catálogo</div>`);

  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const texto = await res.text();

    const parsed = Papa.parse(texto, {header:true, skipEmptyLines:true});
    LIBROS = parsed.data.filter(r => campo(r,'Título'));

    if(LIBROS.length === 0){
      renderState(`<div class="state-box"><span class="glyph">El catálogo está vacío</span>no encontramos libros en la hoja publicada.</div>`);
      return;
    }

    clearState();
    aplicarFiltro('');
  }catch(err){
    renderState(`
      <div class="state-box">
        <span class="glyph">No pudimos abrir el catálogo</span>
        Revisá que la URL de CSV_URL sea la de una hoja <strong>publicada</strong> (no la de edición)
        y que tenga acceso "cualquier persona con el enlace".
        <code>${err.message}</code>
      </div>`);
  }
}

function aplicarFiltro(q){
  const query = normalizar(q);
  VISIBLES = !query ? LIBROS : LIBROS.filter(r => {
    return normalizar(campo(r,'Título')).includes(query) || normalizar(campo(r,'Autor')).includes(query);
  });

  el.count.textContent = LIBROS.length + (query ? ` · ${VISIBLES.length} coinciden` : ' volúmenes');
  renderCarrusel();
}

function renderCarrusel(){
  el.carousel.innerHTML = '';

  if(VISIBLES.length === 0){
    renderState(`<div class="state-box"><span class="glyph">Sin resultados</span>No encontramos libros con esos términos. Probá con otro título o autor.</div>`);
    return;
  }
  clearState();

  VISIBLES.forEach((row, i) => {
    const titulo = campo(row,'Título');
    const autor = campo(row,'Autor');
    const portada = campo(row,'Portada URL');
    const ubicacion = campo(row,'Ubicación');

    const card = document.createElement('button');
    card.className = 'book-card';
    card.setAttribute('role','listitem');
    card.setAttribute('aria-label', titulo + (autor ? ', de ' + autor : ''));

    card.innerHTML = `
      <div class="cover-frame">
        ${ubicacion ? `<span class="tag" title="${ubicacion}">${ubicacion}</span>` : ''}
        ${portada ? `<img src="${portada}" alt="Portada de ${titulo}" loading="lazy">` : `<div class="no-cover">${titulo}</div>`}
      </div>
      <div class="book-meta">
        <span class="t">${titulo}</span>
        <span class="a">${autor || 'Autor desconocido'}</span>
      </div>
    `;

    card.addEventListener('click', () => abrirFicha(row));
    el.carousel.appendChild(card);
  });
}

function abrirFicha(row){
  const titulo = campo(row,'Título');
  const autor = campo(row,'Autor');
  const editorial = campo(row,'Editorial');
  const lugar = campo(row,'Lugar');
  const anio = campo(row,'Año');
  const paginas = campo(row,'Páginas');
  const serie = campo(row,'Serie');
  const ubicacion = campo(row,'Ubicación');
  const sinopsis = campo(row,'Sinopsis');
  const portada = campo(row,'Portada URL');

  el.cardBody.innerHTML = `
    <div class="card-cover">
      ${portada ? `<img src="${portada}" alt="Portada de ${titulo}">` : `<div class="no-cover" style="height:100%">${titulo}</div>`}
    </div>
    <div class="card-info">
      <h2>${titulo}</h2>
      <div class="author">${autor || 'Autor desconocido'}</div>
      <dl class="fields">
        ${editorial ? `<dt>Editorial</dt><dd>${editorial}</dd>` : ''}
        ${lugar ? `<dt>Lugar</dt><dd>${lugar}</dd>` : ''}
        ${anio ? `<dt>Año</dt><dd>${anio}</dd>` : ''}
        ${paginas ? `<dt>Páginas</dt><dd>${paginas}</dd>` : ''}
        ${serie ? `<dt>Serie</dt><dd>${serie}</dd>` : ''}
      </dl>
      ${ubicacion ? `<span class="location-tag">◆ ${ubicacion}</span>` : ''}
      ${sinopsis ? `<div class="synopsis"><span class="label">Sinopsis</span>${sinopsis}</div>` : ''}
    </div>
  `;

  el.overlay.classList.add('open');
  el.closeBtn.focus();
}

function cerrarFicha(){
  el.overlay.classList.remove('open');
}

el.closeBtn.addEventListener('click', cerrarFicha);
el.overlay.addEventListener('click', (e) => { if(e.target === el.overlay) cerrarFicha(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrarFicha(); });

el.search.addEventListener('input', (e) => aplicarFiltro(e.target.value));

el.prevBtn.addEventListener('click', () => el.carousel.scrollBy({left:-420, behavior:'smooth'}));
el.nextBtn.addEventListener('click', () => el.carousel.scrollBy({left:420, behavior:'smooth'}));

cargarDatos();
</script>

</body>
</html>
